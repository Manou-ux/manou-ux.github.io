name: Portfolio CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permissions nécessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Évite plusieurs déploiements simultanés
concurrency:
  group: "github-pages"
  cancel-in-progress: true


jobs:

  # ==========================================================
  # 1. HTML VALIDATION
  # ==========================================================
  html-validation:
    name: 🔍 HTML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .

      - name: Summarize warnings
        if: always()
        shell: bash
        run: |
          logfile=$(ls log*.log 2>/dev/null | head -n1)
          if [ -n "$logfile" ] && grep -q "WARNING" "$logfile"; then
            {
              echo "## ⚠️ HTML Validation warnings"
              echo ""
              grep "WARNING" "$logfile" | head -n 50
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HTML warnings."
          fi


  # ==========================================================
  # 2. JAVASCRIPT QUALITY
  # ==========================================================
  javascript-check:
    name: 🧠 JavaScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          echo "Checking JavaScript files..."

          find assets/js -type f -name "*.js" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking: $file"
            node --check "$file"
          done

          echo "JavaScript syntax check passed."


  # ==========================================================
  # 3. ASSETS / FILES CHECK
  # ==========================================================
  asset-check:
    name: 📦 Assets Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          echo "Checking required files..."

          required_files=(
            "index.html"
            "cv.pdf"
            "cv.jpg"
            "favicon.png"
            "og-image.png"
            "robots.txt"
            "sitemap.xml"
            "assets/css/styles.css"
            "assets/js/data.js"
            "assets/js/gallery.js"
            "assets/js/main.js"
          )

          for file in "${required_files[@]}"
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file -> $file"
              exit 1
            fi

            echo "OK: $file"
          done

          # Références locales statiques (index.html)
          grep -oE '(src|href)="(assets/[^"]+|favicon\.png|og-image\.png|cv\.(pdf|jpg))"' index.html \
            | sed -E 's/.*="([^"]+)"/\1/' \
            | sort -u > /tmp/refs_index.txt

          while read -r ref; do
            if [ ! -f "$ref" ]; then
              echo "ERROR: Missing asset -> $ref"
              exit 1
            fi
            echo "OK (référencé): $ref"
          done < /tmp/refs_index.txt

          # Références des images de la galerie (data.js)
          grep -ohE 'assets/images/[A-Za-z0-9_+./-]+' assets/js/data.js \
            | sort -u > /tmp/refs_data.txt

          while read -r ref; do
            if [ ! -f "$ref" ]; then
              echo "ERROR: Missing asset -> $ref"
              exit 1
            fi
            echo "OK (galerie): $ref"
          done < /tmp/refs_data.txt

          echo "All required files are present."


  # ==========================================================
  # 4. CSS CHECK
  # ==========================================================
  css-check:
    name: 🎨 CSS Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CSS file
        shell: bash
        run: |
          if [ ! -s "assets/css/styles.css" ]; then
            echo "ERROR: styles.css is missing or empty."
            exit 1
          fi

          echo "CSS file check passed."


  # ==========================================================
  # 5. QUALITY GATE
  # ==========================================================
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: ubuntu-latest

    needs:
      - html-validation
      - javascript-check
      - asset-check
      - css-check

    # Ne saute jamais : doit refléter l'état réel des contrôles
    if: always()

    steps:
      - name: Quality Gate
        shell: bash
        run: |
          failed=""

          status=${{ needs.html-validation.result }}
          if [ "$status" != "success" ]; then failed="$failed html-validation:$status"; fi

          status=${{ needs.javascript-check.result }}
          if [ "$status" != "success" ]; then failed="$failed javascript-check:$status"; fi

          status=${{ needs.asset-check.result }}
          if [ "$status" != "success" ]; then failed="$failed asset-check:$status"; fi

          status=${{ needs.css-check.result }}
          if [ "$status" != "success" ]; then failed="$failed css-check:$status"; fi

          echo "======================================"
          if [ -n "$failed" ]; then
            echo "        ❌ QUALITY GATE FAILED"
            echo "======================================"
            echo "Failed gates:$failed"
            echo ""
            exit 1
          fi
          echo "        ✅ QUALITY GATE PASSED"
          echo "======================================"
          echo "The portfolio is ready for deployment."


  # ==========================================================
  # 6. BUILD / PREPARE GITHUB PAGES
  # ==========================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest

    needs: quality-gate

    # Build toujours (même si un contrôle échoue) mais seulement sur main
    if: ${{ always() && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        shell: bash
        run: |
          mkdir -p _site
          cp -r assets _site/
          cp index.html cv.pdf cv.jpg favicon.png og-image.png robots.txt sitemap.xml _site/
          echo "Staged files:"
          find _site -type f | sort
          du -sh _site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site


  # ==========================================================
  # 7. DEPLOY
  # ==========================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest

    needs: build

    # Déploie toujours (même si un contrôle échoue) mais seulement sur main
    if: ${{ always() && github.ref == 'refs/heads/main' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4