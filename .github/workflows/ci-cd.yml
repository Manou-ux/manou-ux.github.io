name: Portfolio CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permissions nécessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Évite plusieurs déploiements simultanés
concurrency:
  group: "github-pages"
  cancel-in-progress: true


jobs:

  # ==========================================================
  # 1. HTML VALIDATION
  # ==========================================================
  html-validation:
    name: 🔍 HTML Validation
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v0.6.0
        with:
          root: .


  # ==========================================================
  # 2. JAVASCRIPT QUALITY
  # ==========================================================
  javascript-check:
    name: 🧠 JavaScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          echo "Checking JavaScript files..."

          find assets/js -type f -name "*.js" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking: $file"
            node --check "$file"
          done

          echo "JavaScript syntax check passed."


  # ==========================================================
  # 3. ASSETS / FILES CHECK
  # ==========================================================
  asset-check:
    name: 📦 Assets Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          echo "Checking required files..."

          required_files=(
            "index.html"
            "cv.pdf"
            "cv.jpg"
            "favicon.png"
            "og-image.png"
            "robots.txt"
            "sitemap.xml"
            "assets/css/styles.css"
            "assets/js/data.js"
            "assets/js/gallery.js"
            "assets/js/main.js"
          )

          for file in "${required_files[@]}"
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file -> $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "All required files are present."


  # ==========================================================
  # 4. CSS CHECK
  # ==========================================================
  css-check:
    name: 🎨 CSS Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CSS file
        shell: bash
        run: |
          if [ ! -s "assets/css/styles.css" ]; then
            echo "ERROR: styles.css is missing or empty."
            exit 1
          fi

          echo "CSS file check passed."


  # ==========================================================
  # 5. QUALITY GATE
  # ==========================================================
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: ubuntu-latest

    needs:
      - html-validation
      - javascript-check
      - asset-check
      - css-check

    steps:
      - name: Quality Gate Passed
        run: |
          echo "======================================"
          echo "        QUALITY GATE PASSED"
          echo "======================================"
          echo ""
          echo "HTML validation     : PASSED"
          echo "JavaScript check    : PASSED"
          echo "Assets check        : PASSED"
          echo "CSS check           : PASSED"
          echo ""
          echo "The portfolio is ready for deployment."
          echo "======================================"


  # ==========================================================
  # 6. BUILD / PREPARE GITHUB PAGES
  # ==========================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest

    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


  # ==========================================================
  # 7. DEPLOY
  # ==========================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest

    needs: build

    # Seulement lorsque le workflow tourne sur main
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4